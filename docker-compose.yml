# ===========================================================================
#  DOCKER COMPOSE — LAMBDA ARCHITECTURE BIG DATA (CORRIGÉ)
#  SE1 (HDFS/YARN) + SE2 (Kafka) + SE3 (Spark sur YARN) + SE4 (Flink) + SE5 (ClickHouse + Grafana)
# ===========================================================================

networks:
  bigdata-network:
    name: bigdata-network
    driver: bridge

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  hadoop_historyserver:
  spark-events:
  clickhouse-data:
  clickhouse-logs:
  grafana-data:

services:

# ===========================================================================
#  SE1 — INFRASTRUCTURE BIG DATA (HDFS + YARN)
# ===========================================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=test
    env_file:
      - ./hadoop.env
    healthcheck:
      test: ["CMD", "hdfs", "dfsadmin", "-report"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - bigdata-network

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    restart: always
    ports:
      - "9864:9864"
    volumes:
      - hadoop_datanode1:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./hadoop.env
    networks:
      - bigdata-network

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    restart: always
    ports:
      - "9865:9864"
    volumes:
      - hadoop_datanode2:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./hadoop.env
    networks:
      - bigdata-network

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: always
    ports:
      - "8088:8088"
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./hadoop.env
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/ws/v1/cluster/info > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - bigdata-network

  nodemanager1:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager1
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9870 resourcemanager:8088 datanode1:9864"
    env_file:
      - ./hadoop.env
    networks:
      - bigdata-network

  nodemanager2:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager2
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9870 resourcemanager:8088 datanode2:9864"
    env_file:
      - ./hadoop.env
    networks:
      - bigdata-network

  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: historyserver
    restart: always
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    environment:
      SERVICE_PRECONDITION: "namenode:9870 resourcemanager:8088"
    env_file:
      - ./hadoop.env
    networks:
      - bigdata-network

  hdfs-init:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-init
    depends_on:
      namenode:
        condition: service_healthy
      datanode1:
        condition: service_started
      datanode2:
        condition: service_started
    restart: "no"
    env_file:
      - ./hadoop.env
    entrypoint: ""
    command: >
      /bin/bash -c "
        echo 'Attente namenode sur hdfs://namenode:9000...' &&
        until hdfs dfsadmin -fs hdfs://namenode:9000 -report > /dev/null 2>&1; do
          echo 'NameNode pas encore prêt, retry dans 5s...'
          sleep 5
        done &&
        echo 'HDFS READY ✔' &&

        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /data/raw/business &&
        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /data/raw/review &&
        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /data/raw/user &&
        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /data/raw/checkin &&
        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /data/raw/tip &&

        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /data/processed/business_enriched &&
        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /data/processed/reviews_enriched &&
        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /data/processed/user_graph_metrics &&
        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /data/processed/checkins_exploded &&
        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /data/processed/axe1_reputation &&
        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /data/processed/axe2_geo &&
        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /data/processed/axe3_social &&
        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /data/processed/axe4_temporal &&

        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /spark/logs &&

        hdfs dfs -fs hdfs://namenode:9000 -chmod -R 777 /data &&
        hdfs dfs -fs hdfs://namenode:9000 -chmod -R 777 /spark &&
        hdfs dfs -fs hdfs://namenode:9000 -mkdir -p /tmp/spark-events &&
        hdfs dfs -fs hdfs://namenode:9000 -chmod 777 /tmp/spark-events &&

        echo 'Arborescence HDFS créée avec succès ✔'
      "
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfs -fs hdfs://namenode:9000 -ls /tmp/spark-events > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - bigdata-network

# ===========================================================================
#  SE2 — INGESTION / KAFKA
# ===========================================================================
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka_se2
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s 
    networks:
      - bigdata-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui_se2
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=Cluster_Local_SE2
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - bigdata-network

# ===========================================================================
#  SE3 — ETL SPARK SUR YARN
#  Correction : spark-master/worker standalone supprimés — YARN gère les ressources
#               image bde2020/spark-submit contient le client Hadoop préconfiguré
#               depends_on python-pipeline (nom corrigé)
# ===========================================================================
  spark-submit-job:
    image: bde2020/spark-submit:3.3.0-hadoop3.3
    container_name: se3-spark-submit
    restart: "no"
    depends_on:
      namenode:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
      hdfs-init:
        condition: service_healthy
    volumes:
      - ./etl/scripts:/app/scripts
      - ./etl/data:/app/data
      - ./etl/output:/app/output
      - ./spark-defaults.conf:/spark/conf/spark-defaults.conf
    env_file:
      - ./hadoop.env
    environment:
      HADOOP_CONF_DIR: /etc/hadoop
      YARN_CONF_DIR: /etc/hadoop
      SPARK_MASTER: yarn
      ENABLE_INIT_DAEMON: "false"
    command: >
      /bin/bash -c "
        echo '⏳ Attente ResourceManager YARN...' &&
        until curl -sf http://resourcemanager:8088/ws/v1/cluster/info > /dev/null 2>&1; do
          echo 'ResourceManager pas encore prêt, retry 5s...' && sleep 5
        done &&
        echo 'YARN READY ✔' &&
        echo '🚀 Soumission du job Spark sur YARN...' &&
        /spark/bin/spark-submit /app/scripts/spark_etl.py
      "
    networks:
      - bigdata-network

  spark-history:
    image: bde2020/spark-history-server:3.3.0-hadoop3.3
    container_name: se3-spark-history
    restart: always
    ports:
      - "18080:18081"
    depends_on:
      namenode:
        condition: service_healthy
      hdfs-init:
        condition: service_healthy
    env_file:
      - ./hadoop.env
    environment:
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=hdfs://namenode:9000/spark/logs"
      SPARK_DAEMON_MEMORY: 1g
    volumes:
      - ./spark-defaults.conf:/spark/conf/spark-defaults.conf
      - spark-events:/tmp/spark-events
    networks:
      - bigdata-network

# ===========================================================================
#  SE4 — STREAM PROCESSING / FLINK
#  Correction : jobmanager et taskmanager épinglés sur flink:1.20-scala_2.12-java11
#               JAR Kafka mis à jour dans le Dockerfile (3.3.0-1.20)
# ===========================================================================
  jobmanager:
    image: flink:1.19-scala_2.12-java11
    container_name: se4-jobmanager
    ports:
      - "8083:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1600m
        rest.bind-address: 0.0.0.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - bigdata-network

  taskmanager:
    image: flink:1.19-scala_2.12-java11
    container_name: se4-taskmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1024m
    depends_on:
      - jobmanager
    networks:
      - bigdata-network

  python-producer:
    build:
      context: ./streaming
    container_name: se4-python-producer
    depends_on:
      kafka:
        condition: service_healthy
    command: ["kafka-producer.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: yelp-reviews-mock
    networks:
      - bigdata-network

  python-flink:
    build:
      context: ./streaming
    container_name: se4-python-flink
    depends_on:
      kafka:
        condition: service_healthy
    command: ["flink.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: yelp-reviews-mock
      # Correction : JAR compatible Flink 1.19 (défini dans streaming/Dockerfile)
      FLINK_KAFKA_CONNECTOR_JAR: /opt/flink/lib/flink-sql-connector-kafka-3.3.0-1.19.jar
    networks:
      - bigdata-network

# ===========================================================================
#  SE5 — VISUALISATION / BI (ClickHouse + Grafana)
#  Correction : port hôte ClickHouse TCP 9001→9009 (évite confusion avec HDFS:9000)
# ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./dashboard/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      CLICKHOUSE_DB: bigdata_db
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bigdata-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-se5
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/se5-dashboard.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboard/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./dashboard/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./dashboard/dashboards:/var/lib/grafana/dashboards
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - bigdata-network