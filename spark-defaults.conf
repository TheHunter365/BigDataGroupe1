
# Connexion YARN
spark.master                        yarn
spark.submit.deployMode             client
spark.hadoop.yarn.resourcemanager.hostname    resourcemanager

# Mémoire driver et exécuteurs
# 4g minimum requis pour PageRank — en dessous Spark fait du spilling disque
spark.driver.memory                 4g
spark.executor.memory               4g
spark.executor.memoryOverhead       1024m

# Nombre d'exécuteurs
spark.executor.cores                2
spark.executor.instances            2

# Shuffle — 200 partitions adapté à un cluster 2 noeuds
spark.sql.shuffle.partitions        200

# Sérialisation — Kryo est 10x plus rapide que Java par défaut
spark.serializer                    org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max     512m

# Gestion mémoire
spark.memory.fraction               0.8
spark.memory.storageFraction        0.2

# Connexion HDFS
spark.hadoop.fs.defaultFS           hdfs://namenode:9000

# Logs
spark.eventLog.enabled              true
spark.eventLog.dir                  hdfs://namenode:9000/spark/logs
spark.history.fs.logDirectory       hdfs://namenode:9000/spark/logs

