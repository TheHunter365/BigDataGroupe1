
services:
  # ── ClickHouse (from SE1 setup) ──────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP
      - "9440:9440"   # TLS
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      CLICKHOUSE_DB: bigdata_db
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bigdata-net

  # ── Grafana (SE5 — Visualisation) ───────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-se5
    ports:
      - "3001:3000"   # Mapped to 3001 (localhost:3000 already in use)
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/se5-dashboard.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./dashboards:/var/lib/grafana/dashboards
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - bigdata-net

volumes:
  clickhouse-data:
  clickhouse-logs:
  grafana-data:

networks:
  bigdata-net:
    driver: bridge
