version: '3'
services:

  # HDFS - NameNode
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always

    ports:
      - 9870:9870
      - 9000:9000

    volumes:
      - hadoop_namenode:/hadoop/dfs/name

    environment:
      - CLUSTER_NAME=test

    env_file:
      - ./hadoop.env

    networks:
      - bigdata-network


  # HDFS - DataNode 1
  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    restart: always

    volumes:
      - hadoop_datanode1:/hadoop/dfs/data

    environment:
      SERVICE_PRECONDITION: "namenode:9870"

    env_file:
      - ./hadoop.env

    networks:
      - bigdata-network


  # HDFS - DataNode 2
  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    restart: always

    volumes:
      - hadoop_datanode2:/hadoop/dfs/data

    environment:
      SERVICE_PRECONDITION: "namenode:9870"

    env_file:
      - ./hadoop.env

    networks:
      - bigdata-network


  # YARN - ResourceManager
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: always

    ports:
      - "8088:8088"

    environment:
      SERVICE_PRECONDITION: "namenode:9870"

    env_file:
      - ./hadoop.env

    networks:
      - bigdata-network


  # YARN - NodeManager
  nodemanager1:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager1
    restart: always

    environment:
      SERVICE_PRECONDITION: "namenode:9870 resourcemanager:8088 datanode1:9864"

    env_file:
      - ./hadoop.env

    networks:
      - bigdata-network


  nodemanager2:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager2
    restart: always

    environment:
      SERVICE_PRECONDITION: "namenode:9870 resourcemanager:8088 datanode2:9864"

    env_file:
      - ./hadoop.env

    networks:
      - bigdata-network

      
  # YARN - HistoryServer
  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: historyserver
    restart: always

    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline

    environment:
      SERVICE_PRECONDITION: "namenode:9870 resourcemanager:8088"

    env_file:
      - ./hadoop.env

    networks:
      - bigdata-network


# NETWORK
networks:
  bigdata-network:


# VOLUMES
volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  hadoop_historyserver: